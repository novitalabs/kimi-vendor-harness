# kimi-k3-flash: which shared K3-family test sets this model runs, for which official rows,
# and only the values where this model differs. Shared definitions: suites/k3-family.yaml
schema_version: 1
suite_contract_version: 1
suites:
- use: stream-spec-p0
  row_ids:
  - '1.0'
  selectors:
    '1.0':
    - suites/novita-api/tests/streaming/test_stream_spec.py
- use: stream-spec-p1
  row_ids:
  - '1.1'
  selectors:
    '1.1':
    - suites/novita-api/tests/streaming/test_stream_spec.py
- use: image-test
  row_ids:
  - '2'
  selectors:
    '2': []
- use: kvv-params
  row_ids:
  - '3'
  selectors:
    '3':
    - tests/params
  config:
    develop_repeat: 1
- use: walle
  row_ids:
  - '4'
  selectors:
    '4':
    - tests/tool_call_json_schema
  config:
    develop_repeat: 1
- use: kvv-k3-features
  row_ids:
  - '5'
  selectors:
    '5':
    - tests/k3_features
  config:
    develop_repeat: 1
- use: kvv-prompt-tokens
  row_ids:
  - '6'
  selectors:
    '6':
    - tests/prompt_tokens
  config:
    develop_repeat: 1
- use: toolcall-thinking-stable2-max
  suite_id: toolcall-thinking-max
  row_ids:
  - '7'
  selectors:
    '7': []
- use: inspect-ocr-max
  row_ids:
  - '8'
  selectors:
    '8': []
  config:
    official_score: 0.883
    runner_fingerprint:
      repository: MoonshotAI/kvv-k3
      repository_commit: 6ec0eaad1ca98933327cf571c0d8b78ab8476551
- use: inspect-mmmu-max
  row_ids:
  - '9'
  selectors:
    '9': []
  config:
    official_score: 0.785
    runner_fingerprint:
      repository: MoonshotAI/kvv-k3
      repository_commit: 6ec0eaad1ca98933327cf571c0d8b78ab8476551
- use: deepswe
  row_ids:
  - '10'
  selectors:
    '10': []
  config:
    min_score: 0.628
    agent_timeout_multiplier: 2.0
    runner_fingerprint:
      agent-timeout-multiplier: '2.0'
