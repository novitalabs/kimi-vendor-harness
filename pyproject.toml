[project]
name = "kimi-agentic-harness"
version = "0.7.0"
description = "Kimi agentic capability and regression test harness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "jsonschema>=4.25",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "referencing==0.37.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["novita_self_test*"]

[project.scripts]
kimi-harness = "novita_self_test.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
