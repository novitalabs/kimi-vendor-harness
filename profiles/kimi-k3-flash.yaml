schema_version: 1
model_id: kimi-k3-flash
family: kimi-k3
status: ready
efforts: [max]
features:
  - protocol
  - tool_call
  - structured_output
  - reasoning
  - streaming
  - prompt_rendering
  - usage
  - conversation_state
  - multimodal
  - error_handling
capabilities:
  reasoning:
    efforts: [max]
  tool_call:
    choices: [none, auto, required]
    dynamic_tools: true
    json_schema: true
  structured_output: [json_object, json_schema]
  streaming: [sse, tool_call_deltas, usage]
tests:
  smoke: [protocol.token_limits, tool_call.choice.none, tool_call.choice.required, structured_output.json_object, structured_output.json_schema, reasoning.effort, streaming.tool_call_deltas, prompt_rendering.parser_vectors]
  tool-call: [tool_call/**, structured_output.tools_combined, conversation_state/**]
  parser: [prompt_rendering.parser_vectors]
  regressions: [regression/**]
notes:
  - Flash feature tests are Kimi-specific API/engine contracts, not a quality score.
  - Benchmark families and full official repeat matrices are outside this profile.
